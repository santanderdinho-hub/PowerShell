<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromoHunt — Promoções consolidadas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand__icon">🔥</span> PromoHunt</div>
    <div class="search">
      <input id="searchInput" type="text" placeholder="Buscar produto em todos os marketplaces…" autocomplete="off" />
      <button id="searchBtn">Buscar</button>
      <button id="dealsBtn" title="Voltar pras promoções do dia">★ Promoções</button>
    </div>
  </header>

  <div class="status-bar" id="statusBar"></div>

  <div class="filters">
    <span class="filters__label">Marketplace:</span>
    <div class="chips" id="marketChips"></div>
    <span class="filters__label">Desconto mín.:</span>
    <select id="minDiscount">
      <option value="0">Qualquer</option>
      <option value="10">10%+</option>
      <option value="20">20%+</option>
      <option value="30">30%+</option>
      <option value="50">50%+</option>
    </select>
  </div>

  <main>
    <p class="results-count" id="resultsCount"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p>Nada por aqui.</p>
      <small id="emptyHint"></small>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
